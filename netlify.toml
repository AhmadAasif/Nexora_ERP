"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  # Install only the stable Flutter SDK files needed for a web build.
  command = '''
    set -eu
    curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json -o /tmp/flutter-releases.json
    FLUTTER_ARCHIVE=$(python3 -c 'import json,sys; d=json.load(open("/tmp/flutter-releases.json")); h=d["current_release"]["stable"]; print(next(r["archive"] for r in d["releases"] if r["hash"] == h))')
    curl -fL "https://storage.googleapis.com/flutter_infra_release/releases/${FLUTTER_ARCHIVE}" -o /tmp/flutter.tar.xz
    mkdir -p /tmp/flutter-sdk
    tar -xf /tmp/flutter.tar.xz -C /tmp/flutter-sdk --strip-components=1 \
      --exclude='*/packages/flutter_tools/test' \
      --exclude='*/packages/flutter/test' \
      --exclude='*/dev' \
      --exclude='*/.dart_tool'
    rm /tmp/flutter.tar.xz
    export PATH="/tmp/flutter-sdk/bin:$PATH"
    flutter config --no-analytics
    # Bootstrap can regenerate this cache; restore the official release version
    # before dependency resolution, without relying on Git version discovery.
    python3 -c 'import json,pathlib; d=json.load(open("/tmp/flutter-releases.json")); r=next(r for r in d["releases"] if r["hash"] == d["current_release"]["stable"]); p=pathlib.Path("/tmp/flutter-sdk/bin/cache/flutter.version.json"); v=json.loads(p.read_text()); v.update(frameworkVersion=r["version"], flutterVersion=r["version"], channel=r["channel"], frameworkRevision=r["hash"], frameworkCommitDate=r["release_date"], repositoryUrl="https://github.com/flutter/flutter.git"); p.write_text(json.dumps(v))'
    # Web scaffolding is tracked in the repository; build it directly.
    flutter pub get
    flutter build web --release
  '''
  publish = "build/web"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
