"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  # Netlify's standard build image does not include Flutter, so install the
  # current stable Flutter SDK during the build.
  command = "set -eu; FLUTTER_ARCHIVE=$(curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json | python3 -c 'import json,sys; d=json.load(sys.stdin); h=d[\"current_release\"][\"stable\"]; print(next(r[\"archive\"] for r in d[\"releases\"] if r[\"hash\"] == h))'); curl -fL \"https://storage.googleapis.com/flutter_infra_release/releases/$FLUTTER_ARCHIVE\" -o /tmp/flutter.tar.xz; tar -xf /tmp/flutter.tar.xz -C /tmp; export PATH=\"/tmp/flutter/bin:$PATH\"; flutter config --no-analytics; flutter create . --platforms=web; flutter pub get; flutter build web --release"
  publish = "build/web"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
