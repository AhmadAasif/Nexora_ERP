"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  # Stream the stable SDK into tar to avoid storing the compressed archive.
  # Exclude development-only files before they consume build disk space.
  command = """
    set -euo pipefail
    FLUTTER_ARCHIVE=$(curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json | python3 scripts/flutter_release.py select /tmp/nexora-flutter-release.json)
    curl -fL "https://storage.googleapis.com/flutter_infra_release/releases/${FLUTTER_ARCHIVE}" | tar -xJ -C /tmp --exclude='flutter/packages/flutter_tools/test' --exclude='flutter/dev' --exclude='flutter/examples'
    export PATH="/tmp/flutter/bin:$PATH"
    # First launch may rebuild the Flutter tool and delete its version cache.
    flutter config --no-analytics
    # Restore official release metadata after bootstrap, before resolving packages.
    python3 scripts/flutter_release.py cache /tmp/nexora-flutter-release.json /tmp/flutter
    flutter pub get
    flutter build web --release
  """
  publish = "build/web"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
